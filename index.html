<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>📒 个人云端记账本</title>

            padding: 0;
            box-sizing: border-box;

            background: #f6f8fc;
            color: #1e293b;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== 登录/注册页面 ===== */
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 24px;
            padding: 2rem 2rem 1.8rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f2f5;
        }
        .auth-container h2 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
        }
        .auth-container .form-group {
            margin-bottom: 1rem;
        }
        .auth-container .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 0.3rem;
        }
        .auth-container .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .auth-container .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .auth-container .btn-primary {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .auth-container .btn-primary:hover {
            background: #1d4ed8;
        }
        .auth-container .auth-switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        .auth-container .auth-switch a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .auth-container .auth-error {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .auth-container .auth-success {
            color: #16a34a;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        /* ===== 主应用样式（与之前相同，精简展示） ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .user-info {
            font-size: 0.85rem;
            color: #475569;
            background: #f1f5f9;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-info .logout-btn {

            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .user-info .logout-btn:hover {
            text-decoration: underline;
        }
        .sync-status {
            font-size: 0.75rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .sync-status.synced {
            color: #16a34a;
            background: #dcfce7;
        }
        .sync-status.syncing {
            color: #f59e0b;
            background: #fef3c7;
        }
        .sync-status.error {
            color: #dc2626;
            background: #fef2f2;
        }
        /* 其他样式与之前完全一致，此处省略，实际使用请复制完整样式 */
        /* 为了保持可读性，此处仅作示意，请使用下方完整代码中的样式 */

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;

            background: #dc2626;
        }
        /* 这里只列关键样式，实际完整样式请在下方完整代码中查看 */

<body>
    <!-- ===== 容器 ===== -->
    <div class="app" id="app">
        <!-- 登录/注册区域（默认显示） -->

                    <label for="authEmail">邮箱</label>
                    <input type="email" id="authEmail" placeholder="your@email.com" required />

                    <label for="authPassword">密码</label>

            <div class="auth-switch">
                <span id="authToggleText">还没有账号？</span>
                <a id="authToggleLink">注册</a>
            </div>
        </div>

        <!-- 主应用区域（登录后显示） -->
        <div id="mainApp" style="display:none;">
            <!-- 头部 -->
            <header class="header">
                <div class="header-left">
                    <h1>📒 个人记账</h1>
                    <span class="sync-status" id="syncStatus">☁️ 同步中...</span>

                <div style="display:flex; align-items:center; gap:1rem;">
                    <span class="user-info" id="userInfo">

                    <button class="btn btn-outline btn-sm" id="exportBtn">📥 导出 CSV</button>
                    <button class="btn btn-outline btn-sm" id="clearAllBtn">🗑 清空全部</button>
                </div>
            </header>

            <!-- 统计卡片 -->
            <section class="stats" id="statsContainer">
                <div class="stat-card accent-blue">
                    <div class="stat-label">总支出</div>
                    <div class="stat-value"><span class="currency">¥</span><span id="totalAmount">0.00</span></div>

            <section class="budget-section" id="budgetSection">

                    <button class="btn btn-success btn-sm budget-set-btn" data-period="daily">设定</button>
                    <span class="budget-status-text" id="budgetDailyStatus"><span class="unset">未设置</span></span>
                </div>
                <div class="budget-row">
                    <span class="period-icon">📆</span>
                    <span class="period-label">每周</span>

                    <button class="btn btn-success btn-sm budget-set-btn" data-period="weekly">设定</button>

                </div>
                <div class="budget-row">

                    <span class="period-label">每月</span>

                    <button class="btn btn-success btn-sm budget-set-btn" data-period="monthly">设定</button>

            <!-- 固定模板 -->
            <section class="template-section" id="templateSection">
                <div class="template-header">
                    <h3>📋 每日固定消费模板</h3>

                </div>
                <div class="template-form" id="templateForm">
                    <div class="form-group">
                        <label for="tplName">名称</label>
                        <input type="text" id="tplName" placeholder="如：早餐" maxlength="20" />
                    </div>
                    <div class="form-group">
                        <label for="tplAmount">金额 (¥)</label>
                        <input type="number" id="tplAmount" placeholder="0.00" min="0.01" step="0.01" />
                    </div>
                    <div class="form-group">
                        <label for="tplCategory">类别</label>

                            <option value="餐饮">🍜 餐饮</option>

                            <option value="购物">🛍 购物</option>
                            <option value="娱乐">🎬 娱乐</option>
                            <option value="居住">🏠 居住</option>
                            <option value="健康">💊 健康</option>
                            <option value="教育">📚 教育</option>

                    </div>
                    <button class="btn btn-primary btn-sm" id="addTemplateBtn">➕ 添加模板</button>
                </div>
                <div class="template-list" id="templateList">
                    <span class="text-muted" style="font-size:0.9rem;">暂无固定模板，请添加</span>
                </div>
            </section>

            <!-- 添加记录 -->
            <section class="form-section" id="entryFormSection">
                <form id="entryForm" class="form-row">
                    <div class="form-group">
                        <label for="entryDate">📅 日期</label>
                        <input type="date" id="entryDate" required />
                    </div>
                    <div class="form-group">
                        <label for="entryCategory">📂 类别</label>
                        <select id="entryCategory">
                            <option value="餐饮">🍜 餐饮</option>
                            <option value="交通">🚌 交通</option>
                            <option value="购物">🛍 购物</option>
                            <option value="娱乐">🎬 娱乐</option>
                            <option value="居住">🏠 居住</option>
                            <option value="健康">💊 健康</option>
                            <option value="教育">📚 教育</option>
                            <option value="其他">📌 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="entryDesc">📝 描述</label>
                        <input type="text" id="entryDesc" placeholder="买什么..." maxlength="40" />
                    </div>
                    <div class="form-group">
                        <label for="entryAmount">💰 金额 (¥)</label>
                        <input type="number" id="entryAmount" placeholder="0.00" min="0.01" step="0.01" required />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">➕ 添加</button>
                    </div>
                </form>
            </section>

            <!-- 记账表格 -->
            <section class="table-wrapper" id="tableWrapper">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr><th>日期 / 描述</th><th>类别</th><th style="text-align:right;">金额</th><th style="text-align:center;">操作</th></tr>
                        </thead>
                        <tbody id="entriesBody">
                            <tr><td colspan="4"><div class="empty-state"><div class="icon">📭</div><div>还没有记账记录</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ============================================================
        // Supabase 配置（您的项目）
        // ============================================================
        const YOUR_SUPABASE_URL = "https://gsrygrucpzynitjhfnri.supabase.co";
        const YOUR_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcnlncnVjcHp5bml0amhmbnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTA4NjUsImV4cCI6MjEwNDA2Njg2NX0.n1n86PpcYKoC3Y80-y5sorn65A3mnNyqN8KFPCc2QIE";

        // ============================================================
        // 初始化 Supabase 客户端
        // ============================================================
        const supabase = window.supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_ANON_KEY);

        // ============================================================
        // 应用逻辑
        // ============================================================
        (function() {
            'use strict';

            // ---------- 状态 ----------
            let currentUser = null; // 存储用户信息 { id, email }
            let entries = [];
            let budget = { daily: null, weekly: null, monthly: null };
            let templates = [];
            let hiddenModules = [];
            let groupState = {};
            let isSyncing = false;

            // ---------- DOM 引用 ----------
            const authArea = document.getElementById('authArea');
            const mainApp = document.getElementById('mainApp');
            const authForm = document.getElementById('authForm');
            const authEmail = document.getElementById('authEmail');
            const authPassword = document.getElementById('authPassword');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const authMessage = document.getElementById('authMessage');
            const authToggleLink = document.getElementById('authToggleLink');
            const authToggleText = document.getElementById('authToggleText');

            const userEmailDisplay = document.getElementById('userEmailDisplay');
            const logoutBtn = document.getElementById('logoutBtn');
            const syncStatusEl = document.getElementById('syncStatus');

            // 主应用DOM（与之前相同，此处只声明，实际与之前完全一致）
            const form = document.getElementById('entryForm');
            const dateInput = document.getElementById('entryDate');
            const categorySelect = document.getElementById('entryCategory');
            const descInput = document.getElementById('entryDesc');
            const amountInput = document.getElementById('entryAmount');
            const tbody = document.getElementById('entriesBody');
            const totalAmountEl = document.getElementById('totalAmount');
            const totalCountEl = document.getElementById('totalCount');
            const todayAmountEl = document.getElementById('todayAmount');
            const maxAmountEl = document.getElementById('maxAmount');
            const toastEl = document.getElementById('toast');

            const budgetDailyInput = document.getElementById('budgetDailyInput');
            const budgetWeeklyInput = document.getElementById('budgetWeeklyInput');
            const budgetMonthlyInput = document.getElementById('budgetMonthlyInput');
            const budgetDailyStatus = document.getElementById('budgetDailyStatus');
            const budgetWeeklyStatus = document.getElementById('budgetWeeklyStatus');
            const budgetMonthlyStatus = document.getElementById('budgetMonthlyStatus');

            const tplNameInput = document.getElementById('tplName');
            const tplAmountInput = document.getElementById('tplAmount');
            const tplCategorySelect = document.getElementById('tplCategory');
            const addTemplateBtn = document.getElementById('addTemplateBtn');
            const templateListEl = document.getElementById('templateList');
            const applyTemplatesBtn = document.getElementById('applyTemplatesBtn');

            const settingsToggleBtn = document.getElementById('settingsToggleBtn');
            const settingsModal = document.getElementById('settingsModal');
            const settingsCloseBtn = document.getElementById('settingsCloseBtn');
            const toggleStats = document.getElementById('toggleStats');
            const toggleBudget = document.getElementById('toggleBudget');
            const toggleTemplate = document.getElementById('toggleTemplate');
            const toggleForm = document.getElementById('toggleForm');
            const toggleTable = document.getElementById('toggleTable');

            const statsContainer = document.getElementById('statsContainer');
            const budgetSection = document.getElementById('budgetSection');
            const templateSection = document.getElementById('templateSection');
            const entryFormSection = document.getElementById('entryFormSection');
            const tableWrapper = document.getElementById('tableWrapper');

            const moduleMap = {
                'stats': { el: statsContainer, toggle: toggleStats, id: 'stats' },
                'budget': { el: budgetSection, toggle: toggleBudget, id: 'budget' },
                'template': { el: templateSection, toggle: toggleTemplate, id: 'template' },
                'form': { el: entryFormSection, toggle: toggleForm, id: 'form' },
                'table': { el: tableWrapper, toggle: toggleTable, id: 'table' }
            };

            // ---------- 工具函数 ----------
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr + 'T00:00:00');
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }

            function formatMoney(val) {
                return Number(val).toFixed(2);
            }

            function getTodayStr() {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }

            function getCategoryClass(cat) {
                const map = {
                    '餐饮': 'food',
                    '交通': 'transport',
                    '购物': 'shopping',
                    '娱乐': 'entertainment',
                    '居住': 'housing',
                    '健康': 'health',
                    '教育': 'education',
                    '其他': 'other'
                };
                return map[cat] || 'other';
            }

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getWeekStart(dateStr) {
                const d = new Date(dateStr + 'T00:00:00');
                const day = d.getDay();
                const diff = day === 0 ? 6 : day - 1;
                d.setDate(d.getDate() - diff);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }

            function getMonthKey(dateStr) {
                return dateStr.substring(0, 7);
            }

            function getCurrentWeekStart() { return getWeekStart(getTodayStr()); }

            function getCurrentMonthKey() { return getTodayStr().substring(0, 7); }

            // ---------- Toast ----------
            let toastTimer = null;

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 3000);
            }

            // ---------- 本地存储（按用户隔离） ----------
            function getLocalKey(baseKey) {
                if (!currentUser) return baseKey;
                return `${baseKey}_${currentUser.id}`;
            }

            function loadLocal() {
                const entriesKey = getLocalKey('dailyLedger_entries');
                const budgetKey = getLocalKey('dailyLedger_budget');
                const templateKey = getLocalKey('dailyLedger_templates');
                const hideKey = getLocalKey('dailyLedger_hiddenModules');
                const groupKey = getLocalKey('dailyLedger_groupState');

                try {
                    const raw = localStorage.getItem(entriesKey);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) entries = parsed;
                    }
                } catch (_) { entries = []; }
                try {
                    const bRaw = localStorage.getItem(budgetKey);
                    if (bRaw) {
                        const parsed = JSON.parse(bRaw);
                        if (typeof parsed === 'number') {
                            budget = { daily: parsed, weekly: null, monthly: null };
                        } else if (parsed && typeof parsed === 'object') {
                            budget = parsed;
                        }
                    }
                } catch (_) { budget = { daily: null, weekly: null, monthly: null }; }
                try {
                    const tRaw = localStorage.getItem(templateKey);
                    if (tRaw) {
                        const parsed = JSON.parse(tRaw);
                        if (Array.isArray(parsed)) templates = parsed;
                    }
                } catch (_) { templates = []; }
                try {
                    const hRaw = localStorage.getItem(hideKey);
                    if (hRaw) {
                        const parsed = JSON.parse(hRaw);
                        if (Array.isArray(parsed)) hiddenModules = parsed;
                        else hiddenModules = [];
                    }
                } catch (_) { hiddenModules = []; }
                try {
                    const gRaw = localStorage.getItem(groupKey);
                    if (gRaw) {
                        const parsed = JSON.parse(gRaw);
                        if (parsed && typeof parsed === 'object') groupState = parsed;
                    }
                } catch (_) { groupState = {}; }
            }

            function saveLocal() {
                if (!currentUser) return;
                const entriesKey = getLocalKey('dailyLedger_entries');
                const budgetKey = getLocalKey('dailyLedger_budget');
                const templateKey = getLocalKey('dailyLedger_templates');
                const hideKey = getLocalKey('dailyLedger_hiddenModules');
                const groupKey = getLocalKey('dailyLedger_groupState');

                try { localStorage.setItem(entriesKey, JSON.stringify(entries)); } catch (e) {}
                try { localStorage.setItem(budgetKey, JSON.stringify(budget)); } catch (e) {}
                try { localStorage.setItem(templateKey, JSON.stringify(templates)); } catch (e) {}
                try { localStorage.setItem(hideKey, JSON.stringify(hiddenModules)); } catch (e) {}
                try { localStorage.setItem(groupKey, JSON.stringify(groupState)); } catch (e) {}
            }

            // ---------- 云端同步（使用当前用户的 user_id） ----------
            function setSyncStatus(status, msg) {
                syncStatusEl.className = 'sync-status ' + status;
                syncStatusEl.textContent = msg;
            }

            async function pushToCloud() {
                if (!currentUser || isSyncing) return;
                isSyncing = true;
                setSyncStatus('syncing', '☁️ 上传中...');

                const data = {
                    entries: entries,
                    budget: budget,
                    templates: templates,
                    hiddenModules: hiddenModules,
                    groupState: groupState
                };
                const userId = currentUser.id;

                try {
                    // 查询是否存在记录
                    const { data: existing, error: queryError } = await supabase
                        .from('ledger_data')
                        .select('id')
                        .eq('user_id', userId)
                        .maybeSingle();

                    if (queryError) throw queryError;

                    let result;
                    if (existing) {
                        result = await supabase
                            .from('ledger_data')
                            .update({ data: data, updated_at: new Date().toISOString() })
                            .eq('user_id', userId);
                    } else {
                        result = await supabase
                            .from('ledger_data')
                            .insert({ user_id: userId, data: data, updated_at: new Date().toISOString() });
                    }

                    if (result.error) throw result.error;

                    setSyncStatus('synced', '✅ 已同步');
                    isSyncing = false;
                } catch (err) {
                    console.error('同步失败:', err);
                    setSyncStatus('error', '⚠️ 同步失败');
                    isSyncing = false;
                    showToast('⚠️ 云端同步失败，数据已保存在本地。错误信息已输出到控制台。');
                }
            }

            async function pullFromCloud() {
                if (!currentUser || isSyncing) return;
                isSyncing = true;
                setSyncStatus('syncing', '☁️ 拉取中...');

                const userId = currentUser.id;

                try {
                    const { data, error } = await supabase
                        .from('ledger_data')
                        .select('data')
                        .eq('user_id', userId)
                        .maybeSingle();

                    if (error) throw error;

                    if (data) {
                        const cloudData = data.data;
                        if (cloudData.entries) entries = cloudData.entries;
                        if (cloudData.budget) budget = cloudData.budget;
                        if (cloudData.templates) templates = cloudData.templates;
                        if (cloudData.hiddenModules) hiddenModules = cloudData.hiddenModules;
                        if (cloudData.groupState) groupState = cloudData.groupState;
                        saveLocal();
                        renderAll();
                        setSyncStatus('synced', '✅ 已同步');
                        showToast('✅ 已从云端加载数据');
                    } else {
                        // 云端无数据，上传本地
                        await pushToCloud();
                    }
                    isSyncing = false;
                } catch (err) {
                    console.error('拉取失败:', err);
                    setSyncStatus('error', '⚠️ 离线模式');
                    isSyncing = false;
                    loadLocal();
                    renderAll();
                    showToast('⚠️ 无法连接云端，使用本地数据');
                }
            }

            // ---------- 计算总和 ----------
            function calcTotals() {
                const daily = {};
                const weekly = {};
                const monthly = {};
                for (const e of entries) {
                    const amt = Number(e.amount);
                    const d = e.date;
                    daily[d] = (daily[d] || 0) + amt;
                    const wk = getWeekStart(d);
                    weekly[wk] = (weekly[wk] || 0) + amt;
                    const mo = getMonthKey(d);
                    monthly[mo] = (monthly[mo] || 0) + amt;
                }
                return { daily, weekly, monthly };
            }

            function isOverBudget(entry, totals) {
                if (budget.daily !== null && budget.daily > 0) {
                    const dayTotal = totals.daily[entry.date] || 0;
                    if (dayTotal > budget.daily) return true;
                }
                if (budget.weekly !== null && budget.weekly > 0) {
                    const wk = getWeekStart(entry.date);
                    const weekTotal = totals.weekly[wk] || 0;
                    if (weekTotal > budget.weekly) return true;
                }
                if (budget.monthly !== null && budget.monthly > 0) {
                    const mo = getMonthKey(entry.date);
                    const monthTotal = totals.monthly[mo] || 0;
                    if (monthTotal > budget.monthly) return true;
                }
                return false;
            }

            // ---------- 渲染 ----------
            function renderEntries() {
                const total = entries.reduce((sum, e) => sum + Number(e.amount), 0);
                const count = entries.length;
                const todayStr = getTodayStr();
                const todayTotal = entries.filter(e => e.date === todayStr).reduce((sum, e) => sum + Number(e.amount), 0);
                const max = entries.length ? Math.max(...entries.map(e => Number(e.amount))) : 0;

                totalAmountEl.textContent = formatMoney(total);
                totalCountEl.textContent = count;
                todayAmountEl.textContent = formatMoney(todayTotal);
                maxAmountEl.textContent = formatMoney(max);

                const totals = calcTotals();
                updateBudgetStatus(totals);

                if (entries.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="4"><div class="empty-state"><div class="icon">📭</div><div>还没有记账记录</div></div></td></tr>`;
                    return;
                }

                const groups = {};
                for (const e of entries) {
                    const d = e.date;
                    if (!groups[d]) groups[d] = [];
                    groups[d].push(e);
                }
                const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

                let html = '';
                for (const date of sortedDates) {
                    const items = groups[date];
                    items.sort((a, b) => (b.id || 0) - (a.id || 0));

                    const dayTotal = totals.daily[date] || 0;
                    const isDayOver = (budget.daily !== null && budget.daily > 0 && dayTotal > budget.daily);
                    const wk = getWeekStart(date);
                    const mo = getMonthKey(date);
                    const weekTotal = totals.weekly[wk] || 0;
                    const monthTotal = totals.monthly[mo] || 0;
                    const isWeekOver = (budget.weekly !== null && budget.weekly > 0 && weekTotal > budget.weekly);
                    const isMonthOver = (budget.monthly !== null && budget.monthly > 0 && monthTotal > budget.monthly);
                    const groupOver = isDayOver || isWeekOver || isMonthOver;

                    const isCollapsed = groupState[date] === false;
                    const arrowClass = isCollapsed ? 'collapsed' : '';
                    const overClass = groupOver ? 'over-budget' : '';
                    html += `
                        <tr class="group-header ${overClass}" data-date="${date}">
                            <td colspan="4">
                                <span class="group-toggle ${arrowClass}">▶</span>
                                <span class="group-date">📅 ${formatDate(date)}</span>
                                <span style="margin-left:1rem; font-weight:400; color:#64748b;">共 ${items.length} 笔</span>
                                <span style="float:right; font-weight:600;">合计：<span class="group-total">¥${formatMoney(dayTotal)}</span></span>
                            </td>
                        </tr>
                    `;

                    const detailClass = isCollapsed ? 'collapsed' : '';
                    for (const entry of items) {
                        const catClass = getCategoryClass(entry.category);
                        const over = isOverBudget(entry, totals);
                        const overRow = over ? 'over-budget' : '';
                        html += `
                            <tr class="detail-row ${detailClass} ${overRow}" data-date="${date}">
                                <td>${escapeHtml(entry.description || '-')}</td>
                                <td><span class="category-badge ${catClass}">${entry.category || '其他'}</span></td>
                                <td style="text-align:right;"><span class="amount">¥${formatMoney(entry.amount)}</span></td>
                                <td style="text-align:center;">
                                    <button class="delete-btn" data-id="${entry.id}" title="删除">✕</button>
                                </td>
                            </tr>
                        `;
                    }
                }

                tbody.innerHTML = html;

                tbody.querySelectorAll('.group-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const date = this.dataset.date;
                        const isCurrentlyCollapsed = this.querySelector('.group-toggle').classList.contains(
                        'collapsed');
                        const newCollapsed = !isCurrentlyCollapsed;
                        groupState[date] = !newCollapsed;
                        saveLocal();
                        const detailRows = tbody.querySelectorAll(`.detail-row[data-date="${date}"]`);
                        detailRows.forEach(row => {
                            if (newCollapsed) {
                                row.classList.add('collapsed');
                            } else {
                                row.classList.remove('collapsed');
                            }
                        });
                        const toggle = this.querySelector('.group-toggle');
                        if (newCollapsed) {
                            toggle.classList.add('collapsed');
                        } else {
                            toggle.classList.remove('collapsed');
                        }
                        pushToCloud();
                    });
                });

                tbody.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        deleteEntry(id);
                    });
                });
            }

            function updateBudgetStatus(totals) {
                const today = getTodayStr();
                const weekStart = getCurrentWeekStart();
                const monthKey = getCurrentMonthKey();

                updateBudgetStatusLine(budgetDailyStatus, budget.daily, totals.daily[today] || 0);
                updateBudgetStatusLine(budgetWeeklyStatus, budget.weekly, totals.weekly[weekStart] || 0);
                updateBudgetStatusLine(budgetMonthlyStatus, budget.monthly, totals.monthly[monthKey] || 0);
            }

            function updateBudgetStatusLine(el, limit, used) {
                if (limit === null || limit === 0) {
                    el.innerHTML = `<span class="unset">未设置</span>`;
                    return;
                }
                const remaining = limit - used;
                const remainingAbs = Math.abs(remaining);
                const formatted = formatMoney(remainingAbs);
                let statusHtml = '';
                if (remaining >= 0) {
                    statusHtml = `<span class="remaining positive">剩余 ¥${formatted}</span>`;
                } else {
                    statusHtml = `<span class="remaining negative">超支 ¥${formatted}</span>`;
                }
                el.innerHTML = `
                    ${statusHtml}
                    <span class="limit-info">（上限 ¥${formatMoney(limit)}）</span>
                `;
            }

            function renderTemplates() {
                if (templates.length === 0) {
                    templateListEl.innerHTML = `<span class="text-muted" style="font-size:0.9rem;">暂无固定模板，请添加</span>`;
                    return;
                }
                let html = '';
                for (let i = 0; i < templates.length; i++) {
                    const t = templates[i];
                    const catClass = getCategoryClass(t.category);
                    html += `
                        <span class="template-tag">
                            <span class="tpl-name">${escapeHtml(t.name)}</span>
                            <span class="tpl-amount">¥${formatMoney(t.amount)}</span>
                            <span class="tpl-category category-badge ${catClass}">${t.category}</span>
                            <button class="tpl-del" data-index="${i}" title="删除模板">✕</button>
                        </span>
                    `;
                }
                templateListEl.innerHTML = html;

                templateListEl.querySelectorAll('.tpl-del').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const idx = parseInt(this.dataset.index);
                        deleteTemplate(idx);
                    });
                });
            }

            function applyModuleVisibility() {
                for (const key in moduleMap) {
                    const mod = moduleMap[key];
                    mod.el.classList.remove('module-hidden');
                    mod.toggle.checked = true;
                }
                for (const id of hiddenModules) {
                    if (moduleMap[id]) {
                        moduleMap[id].el.classList.add('module-hidden');
                        moduleMap[id].toggle.checked = false;
                    }
                }
            }

            function renderAll() {
                applyModuleVisibility();
                renderEntries();
                renderTemplates();
                budgetDailyInput.value = budget.daily !== null ? budget.daily : '';
                budgetWeeklyInput.value = budget.weekly !== null ? budget.weekly : '';
                budgetMonthlyInput.value = budget.monthly !== null ? budget.monthly : '';
            }

            // ---------- CRUD ----------
            function addEntry(date, category, description, amount) {
                const id = Date.now() + Math.random() * 1000;
                entries.push({
                    id: id,
                    date: date,
                    category: category.trim(),
                    description: description.trim(),
                    amount: Math.round(Number(amount) * 100) / 100
                });
                saveLocal();
                renderAll();
                pushToCloud();
                showToast('✅ 记录已添加');
            }

            function deleteEntry(id) {
                if (!confirm('确定要删除这条记录吗？')) return;
                entries = entries.filter(e => e.id !== id);
                saveLocal();
                renderAll();
                pushToCloud();
                showToast('🗑 已删除');
            }

            function clearAll() {
                if (entries.length === 0) { showToast('📭 已经没有记录了'); return; }
                if (!confirm('确定要删除全部记账记录吗？此操作不可撤销！')) return;
                entries = [];
                saveLocal();
                renderAll();
                pushToCloud();
                showToast('🗑 已清空全部记录');
            }

            function addTemplate() {
                const name = tplNameInput.value.trim();
                const amount = parseFloat(tplAmountInput.value);
                const category = tplCategorySelect.value;
                if (!name) { showToast('⚠️ 请输入模板名称'); return; }
                if (!amount || isNaN(amount) || amount <= 0) { showToast('⚠️ 请输入有效的金额（大于0）'); return; }
                templates.push({ name, amount: Math.round(amount * 100) / 100, category });
                saveLocal();
                renderAll();
                pushToCloud();
                tplNameInput.value = '';
                tplAmountInput.value = '';
                tplNameInput.focus();
                showToast('✅ 模板已添加');
            }

            function deleteTemplate(index) {
                if (!confirm('确定删除该模板吗？')) return;
                templates.splice(index, 1);
                saveLocal();
                renderAll();
                pushToCloud();
                showToast('🗑 模板已删除');
            }

            function applyTemplatesToday() {
                if (templates.length === 0) { showToast('📭 暂无固定模板，请先添加'); return; }
                const today = getTodayStr();
                let addedCount = 0;
                for (const t of templates) {
                    entries.push({
                        id: Date.now() + Math.random() * 1000 + addedCount,
                        date: today,
                        category: t.category,
                        description: t.name + '（固定）',
                        amount: t.amount
                    });
                    addedCount++;
                }
                saveLocal();
                renderAll();
                pushToCloud();
                showToast(`✅ 已添加今日 ${addedCount} 笔固定消费`);
            }

            function setBudget(period) {
                let input, statusEl;
                if (period === 'daily') {
                    input = budgetDailyInput;
                    statusEl = budgetDailyStatus;
                } else if (period === 'weekly') {
                    input = budgetWeeklyInput;
                    statusEl = budgetWeeklyStatus;
                } else if (period === 'monthly') {
                    input = budgetMonthlyInput;
                    statusEl = budgetMonthlyStatus;
                } else { return; }

                const val = parseFloat(input.value);
                if (isNaN(val) || val < 0) {
                    showToast('⚠️ 请输入有效的预算金额（≥0）');
                    return;
                }
                if (val === 0) {
                    budget[period] = null;
                } else {
                    budget[period] = Math.round(val * 100) / 100;
                }
                saveLocal();
                renderAll();
                pushToCloud();
                const label = { daily: '每日', weekly: '每周', monthly: '每月' } [period];
                if (budget[period] === null) {
                    showToast(`✅ 已取消${label}预算`);
                } else {
                    showToast(`✅ ${label}预算设为 ¥${formatMoney(budget[period])}`);
                }
            }

            function exportCSV() {
                if (entries.length === 0) { showToast('📭 没有记录可导出'); return; }
                const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
                const headers = ['日期', '类别', '描述', '金额'];
                const rows = sorted.map(e => [
                    e.date,
                    e.category || '其他',
                    (e.description || '').replace(/,/g, '，'),
                    Number(e.amount).toFixed(2)
                ]);
                let csv = headers.join(',') + '\n';
                for (const row of rows) csv += row.join(',') + '\n';

                try {
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    link.href = url;
                    link.download = `记账_${getTodayStr()}.csv`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast('📥 导出成功');
                } catch (e) {
                    showToast('⚠️ 导出失败');
                }
            }

            function handleSubmit(e) {
                e.preventDefault();
                const date = dateInput.value;
                const category = categorySelect.value;
                const description = descInput.value.trim();
                const amount = amountInput.value.trim();

                if (!date) { showToast('⚠️ 请选择日期'); return; }
                if (!amount || isNaN(Number(amount)) || Number(amount) <= 0) {
                    showToast('⚠️ 请输入有效的金额 (大于0)');
                    return;
                }
                if (date > getTodayStr()) { showToast('⚠️ 日期不能是未来日期'); return; }

                addEntry(date, category, description, amount);
                descInput.value = '';
                amountInput.value = '';
                dateInput.value = getTodayStr();
                descInput.focus();
            }

            // ---------- 模块管理 ----------
            function initModuleSettings() {
                // 由于主应用在登录后渲染，需要确保DOM存在
                // 绑定事件
                if (settingsToggleBtn) {
                    settingsToggleBtn.addEventListener('click', function() {
                        settingsModal.classList.add('active');
                    });
                }
                if (settingsCloseBtn) {
                    settingsCloseBtn.addEventListener('click', function() {
                        settingsModal.classList.remove('active');
                    });
                }
                if (settingsModal) {
                    settingsModal.addEventListener('click', function(e) {
                        if (e.target === this) {
                            settingsModal.classList.remove('active');
                        }
                    });
                }

                for (const key in moduleMap) {
                    const mod = moduleMap[key];
                    if (mod.toggle) {
                        mod.toggle.addEventListener('change', function() {
                            if (this.checked) {
                                const idx = hiddenModules.indexOf(key);
                                if (idx > -1) hiddenModules.splice(idx, 1);
                            } else {
                                if (!hiddenModules.includes(key)) {
                                    hiddenModules.push(key);
                                }
                            }
                            saveLocal();
                            applyModuleVisibility();
                            pushToCloud();
                        });
                    }
                }
            }

            // ---------- 认证相关 ----------
            let isLoginMode = true; // true=登录, false=注册

            function toggleAuthMode() {
                isLoginMode = !isLoginMode;
                authSubmitBtn.textContent = isLoginMode ? '登录' : '注册';
                authToggleText.textContent = isLoginMode ? '还没有账号？' : '已有账号？';
                authToggleLink.textContent = isLoginMode ? '注册' : '登录';
                authMessage.textContent = '';
            }

            async function handleAuthSubmit(e) {
                e.preventDefault();
                const email = authEmail.value.trim();
                const password = authPassword.value;
                authMessage.textContent = '';

                if (!email || !password) {
                    authMessage.textContent = '请填写邮箱和密码';
                    return;
                }
                if (password.length < 6) {
                    authMessage.textContent = '密码至少6位';
                    return;
                }

                try {
                    let result;
                    if (isLoginMode) {
                        result = await supabase.auth.signInWithPassword({ email, password });
                    } else {
                        result = await supabase.auth.signUp({ email, password });
                    }

                    if (result.error) throw result.error;

                    if (isLoginMode) {
                        // 登录成功
                        const user = result.data.user;
                        currentUser = { id: user.id, email: user.email };
                        userEmailDisplay.textContent = user.email;
                        authArea.style.display = 'none';
                        mainApp.style.display = 'block';
                        loadLocal(); // 加载本地存储
                        renderAll();
                        pullFromCloud(); // 拉取云端数据
                        showToast('✅ 登录成功');
                    } else {
                        // 注册成功
                        authMessage.textContent = '✅ 注册成功！请登录';
                        authMessage.className = 'auth-success';
                        // 自动切换到登录模式
                        if (result.data.user) {
                            // 注册后自动登录
                            currentUser = { id: result.data.user.id, email: result.data.user.email };
                            userEmailDisplay.textContent = currentUser.email;
                            authArea.style.display = 'none';
                            mainApp.style.display = 'block';
                            loadLocal();
                            renderAll();
                            pushToCloud(); // 上传本地数据（如果有）
                            showToast('✅ 注册并登录成功');
                        } else {
                            toggleAuthMode(); // 切换到登录
                            authEmail.value = email;
                            authPassword.value = '';
                            authMessage.textContent = '请登录您的账号';
                        }
                    }
                } catch (err) {
                    console.error('认证错误:', err);
                    authMessage.textContent = err.message || '认证失败，请重试';
                    authMessage.className = 'auth-error';
                }
            }

            // ---------- 退出登录 ----------
            function logout() {
                if (!confirm('确定要退出吗？')) return;
                supabase.auth.signOut();
                currentUser = null;
                authArea.style.display = 'block';
                mainApp.style.display = 'none';
                // 清理本地存储（可选）
                // 不清除，保留本地缓存，下次登录可恢复
                showToast('已退出');
            }

            // ---------- 检查已有会话 ----------
            async function checkSession() {
                const { data, error } = await supabase.auth.getSession();
                if (error) {
                    console.warn('获取会话失败:', error);
                    return;
                }
                if (data.session) {
                    const user = data.session.user;
                    currentUser = { id: user.id, email: user.email };
                    userEmailDisplay.textContent = user.email;
                    authArea.style.display = 'none';
                    mainApp.style.display = 'block';
                    loadLocal();
                    renderAll();
                    pullFromCloud();
                    showToast('✅ 已自动登录');
                }
            }

            // ---------- 初始化 ----------
            function init() {
                // 设置默认日期
                if (dateInput) dateInput.value = getTodayStr();

                // 认证事件
                authForm.addEventListener('submit', handleAuthSubmit);
                authToggleLink.addEventListener('click', toggleAuthMode);

                // 退出按钮
                logoutBtn.addEventListener('click', logout);

                // 主应用事件
                if (form) form.addEventListener('submit', handleSubmit);
                const clearBtn = document.getElementById('clearAllBtn');
                if (clearBtn) clearBtn.addEventListener('click', clearAll);
                const exportBtn = document.getElementById('exportBtn');
                if (exportBtn) exportBtn.addEventListener('click', exportCSV);

                document.querySelectorAll('.budget-set-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setBudget(this.dataset.period);
                    });
                });
                [budgetDailyInput, budgetWeeklyInput, budgetMonthlyInput].forEach((inp, idx) => {
                    if (!inp) return;
                    const periods = ['daily', 'weekly', 'monthly'];
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            setBudget(periods[idx]);
                        }
                    });
                });

                if (addTemplateBtn) {
                    addTemplateBtn.addEventListener('click', addTemplate);
                }
                if (tplAmountInput) {
                    tplAmountInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault();
                            addTemplate(); }
                    });
                }
                if (applyTemplatesBtn) {
                    applyTemplatesBtn.addEventListener('click', applyTemplatesToday);
                }

                initModuleSettings();

                // 自动同步定时器
                setInterval(() => {
                    if (currentUser && navigator.onLine) {
                        pushToCloud();
                    }
                }, 30000);

                // 检查已登录状态
                checkSession();

                // 监听 auth 变化（多标签页同步）
                supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        const user = session.user;
                        currentUser = { id: user.id, email: user.email };
                        userEmailDisplay.textContent = user.email;
                        authArea.style.display = 'none';
                        mainApp.style.display = 'block';
                        loadLocal();
                        renderAll();
                        pullFromCloud();
                        showToast('✅ 已登录');
                    } else if (event === 'SIGNED_OUT') {
                        currentUser = null;
                        authArea.style.display = 'block';
                        mainApp.style.display = 'none';
                        showToast('已退出');
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
